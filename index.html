<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="유튜브 채널 백년해방에 등장한 전국 396개 맛집 지도">
<title>백년해방 맛집 지도</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<!-- MarkerCluster CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<!-- Pretendard 폰트 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
/* ===== CSS 변수 디자인 시스템 ===== */
:root {
  --font-base: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  --color-primary: #FF4B2B;
  --color-primary-light: #FF6B4A;
  --color-bg: #FFFFFF;
  --color-surface: #FFFFFF;
  --color-surface-2: #F8F8FA;
  --color-border: #EAEAEF;
  --color-text-primary: #111118;
  --color-text-secondary: #6B6B80;
  --color-text-muted: #A0A0B0;
  --color-overlay: rgba(0, 0, 0, 0.45);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 4px rgba(0,0,0,0.07), 0 2px 8px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.13), 0 4px 12px rgba(0,0,0,0.07);
  --shadow-sheet: 0 -4px 24px rgba(0,0,0,0.12), 0 -1px 6px rgba(0,0,0,0.06);

  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-base: 280ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 380ms cubic-bezier(0.4, 0, 0.2, 1);

  --header-height: 60px;
  --sheet-peek: 72px;
  --sheet-mid: 42vh;
  --sheet-full: 87vh;
}

/* ===== 리셋 & 기본 ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-base);
  background: var(--color-bg);
  color: var(--color-text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button { cursor: pointer; border: none; background: none; font-family: inherit; }
input { font-family: inherit; }
a { color: inherit; text-decoration: none; }

/* ===== 헤더 ===== */
#header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-height);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  z-index: 1000;
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 10px;
  box-shadow: var(--shadow-sm);
}
#header-logo {
  width: 32px;
  height: 32px;
  background: var(--color-primary);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
#header-title {
  flex: 1;
  min-width: 0;
}
#header-title h1 {
  font-size: 15px;
  font-weight: 700;
  color: var(--color-text-primary);
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#header-title .subtitle {
  font-size: 11px;
  color: var(--color-text-muted);
  font-weight: 400;
  margin-top: 1px;
}
#header-channel-link {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 600;
  color: var(--color-text-secondary);
  white-space: nowrap;
  transition: all var(--transition-fast);
  text-decoration: none;
}
#header-channel-link:hover {
  background: #FFF0EE;
  border-color: #FFCCC5;
  color: var(--color-primary);
}

/* ===== 지도 ===== */
#map {
  position: fixed;
  top: var(--header-height);
  left: 0; right: 0;
  bottom: 0;
  z-index: 1;
}

/* ===== 지도 위 컨트롤 버튼 ===== */
#map-controls {
  position: fixed;
  right: 14px;
  bottom: calc(var(--sheet-peek) + 16px);
  z-index: 900;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: bottom var(--transition-slow);
}
.map-btn {
  width: 44px;
  height: 44px;
  background: var(--color-surface);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-text-secondary);
  transition: all var(--transition-fast);
  border: 1px solid var(--color-border);
}
.map-btn:active, .map-btn:hover {
  background: var(--color-surface-2);
  color: var(--color-primary);
  transform: scale(1.05);
}
.map-btn.active {
  background: var(--color-primary);
  color: white;
  border-color: var(--color-primary);
}

/* ===== 바텀 시트 ===== */
#sheet {
  position: fixed;
  left: 0; right: 0;
  bottom: 0;
  z-index: 800;
  background: var(--color-surface);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  box-shadow: var(--shadow-sheet);
  display: flex;
  flex-direction: column;
  transition: transform var(--transition-slow);
  will-change: transform;
  touch-action: none;
}

/* 시트 상태별 transform */
#sheet.state-peek   { transform: translateY(calc(100% - var(--sheet-peek))); }
#sheet.state-mid    { transform: translateY(calc(100% - var(--sheet-mid))); }
#sheet.state-full   { transform: translateY(calc(100% - var(--sheet-full))); }

/* 시트 내부 구조 */
#sheet-handle-area {
  padding: 10px 0 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  cursor: grab;
  user-select: none;
}
#sheet-handle-area:active { cursor: grabbing; }
.drag-handle {
  width: 36px;
  height: 4px;
  background: var(--color-border);
  border-radius: var(--radius-full);
}

#search-bar-wrap {
  padding: 0 14px 10px;
  flex-shrink: 0;
}
#search-bar {
  display: flex;
  align-items: center;
  background: var(--color-surface-2);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-full);
  padding: 0 14px;
  gap: 8px;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  height: 42px;
}
#search-bar:focus-within {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(255,75,43,0.10);
}
#search-input {
  flex: 1;
  border: none;
  background: none;
  outline: none;
  font-size: 14px;
  font-weight: 400;
  color: var(--color-text-primary);
  min-width: 0;
}
#search-input::placeholder { color: var(--color-text-muted); }
#search-clear {
  width: 20px;
  height: 20px;
  border-radius: var(--radius-full);
  background: var(--color-text-muted);
  color: white;
  display: none;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 12px;
  transition: background var(--transition-fast);
}
#search-clear.visible { display: flex; }
#search-clear:hover { background: var(--color-text-secondary); }

/* 필터 칩 영역 */
#filter-wrap {
  flex-shrink: 0;
  padding-bottom: 8px;
}
#filter-chips {
  display: flex;
  gap: 6px;
  padding: 0 14px;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
#filter-chips::-webkit-scrollbar { display: none; }
.filter-chip {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 11px;
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-secondary);
  background: var(--color-surface);
  white-space: nowrap;
  cursor: pointer;
  transition: all var(--transition-fast);
  flex-shrink: 0;
  height: 30px;
}
.filter-chip:hover {
  border-color: var(--color-primary-light);
  color: var(--color-primary);
}
.filter-chip.active {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: white;
}
.chip-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.filter-chip.active .chip-dot { background: rgba(255,255,255,0.7); }

/* 리스트 영역 */
#list-area {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 0 14px 32px;
}
#list-area::-webkit-scrollbar { width: 4px; }
#list-area::-webkit-scrollbar-track { background: transparent; }
#list-area::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

#list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0 10px;
}
#list-count {
  font-size: 12px;
  color: var(--color-text-muted);
  font-weight: 500;
}
#list-sort-hint {
  font-size: 11px;
  color: var(--color-text-muted);
}

#restaurant-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* 식당 카드 */
.restaurant-card {
  background: var(--color-surface);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  cursor: pointer;
  transition: all var(--transition-fast);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.restaurant-card:hover {
  border-color: var(--color-primary-light);
  box-shadow: var(--shadow-sm);
  transform: translateY(-1px);
}
.restaurant-card:active {
  transform: translateY(0);
  box-shadow: none;
}
.restaurant-card.highlighted {
  border-color: var(--color-primary);
  background: #FFF8F7;
  box-shadow: 0 0 0 3px rgba(255,75,43,0.10);
}
.card-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-top: 4px;
  flex-shrink: 0;
  box-shadow: 0 0 0 2.5px white, 0 0 0 4px currentColor;
}
.card-content {
  flex: 1;
  min-width: 0;
}
.card-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--color-text-primary);
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-area-chip {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: var(--radius-full);
  font-size: 10px;
  font-weight: 600;
  margin-bottom: 5px;
  color: white;
  opacity: 0.9;
}
.card-video {
  font-size: 11px;
  color: var(--color-text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 4px;
}
.card-video-icon { flex-shrink: 0; color: var(--color-primary); opacity: 0.7; }

/* 빈 상태 */
#empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--color-text-muted);
  display: none;
}
#empty-state.visible { display: block; }
#empty-state svg { margin-bottom: 12px; opacity: 0.4; }
#empty-state p { font-size: 14px; font-weight: 500; }
#empty-state small { font-size: 12px; margin-top: 4px; display: block; }

/* ===== 팝업 커스텀 스타일 ===== */
.leaflet-popup-content-wrapper {
  border-radius: var(--radius-lg) !important;
  box-shadow: var(--shadow-lg) !important;
  padding: 0 !important;
  overflow: hidden;
  border: 1px solid var(--color-border);
}
.leaflet-popup-content {
  margin: 0 !important;
  width: 220px !important;
}
.leaflet-popup-tip-container { display: none; }
.popup-inner {
  padding: 14px 16px 16px;
}
.popup-region-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: var(--radius-full);
  font-size: 10px;
  font-weight: 700;
  margin-bottom: 6px;
  color: white;
}
.popup-name {
  font-size: 16px;
  font-weight: 800;
  color: var(--color-text-primary);
  line-height: 1.3;
  margin-bottom: 4px;
}
.popup-area {
  font-size: 12px;
  color: var(--color-text-secondary);
  margin-bottom: 10px;
}
.popup-video-title {
  font-size: 11px;
  color: var(--color-text-muted);
  margin-bottom: 10px;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.popup-yt-link {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--color-primary);
  color: white;
  font-size: 12px;
  font-weight: 700;
  padding: 9px 14px;
  border-radius: var(--radius-sm);
  transition: background var(--transition-fast);
  cursor: pointer;
  width: 100%;
}
.popup-yt-link:hover { background: var(--color-primary-light); }

/* ===== 현재 위치 토스트 ===== */
#toast {
  position: fixed;
  top: calc(var(--header-height) + 12px);
  left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: var(--color-text-primary);
  color: white;
  padding: 10px 18px;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 600;
  z-index: 2000;
  transition: transform var(--transition-base);
  white-space: nowrap;
  box-shadow: var(--shadow-md);
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* ===== 가까운 맛집 배지 ===== */
.near-badge {
  position: absolute;
  top: -6px; right: -6px;
  background: #FFD700;
  color: #7A5500;
  font-size: 8px;
  font-weight: 800;
  padding: 2px 4px;
  border-radius: var(--radius-sm);
  border: 1.5px solid white;
  pointer-events: none;
}

/* ===== 데스크탑 레이아웃 ===== */
@media (min-width: 768px) {
  :root {
    --sheet-full: 100vh;
  }
  #sheet {
    position: fixed;
    top: var(--header-height);
    left: 0;
    bottom: 0;
    right: auto;
    width: 360px;
    border-radius: 0;
    box-shadow: 4px 0 24px rgba(0,0,0,0.10);
    transform: none !important;
    transition: none;
  }
  #sheet-handle-area { display: none; }
  #map { left: 360px; top: var(--header-height); }
  #map-controls { bottom: 20px; }
  #list-area { padding-bottom: 20px; }
  #search-bar-wrap { padding-top: 14px; }
}

/* ===== 마커 커스텀 ===== */
.custom-marker {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2.5px solid white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 1px 3px rgba(0,0,0,0.15);
  transition: transform 0.15s ease;
}
.custom-marker:hover { transform: scale(1.25); }
.custom-marker.near-highlight {
  border-color: #FFD700;
  box-shadow: 0 0 0 3px rgba(255,215,0,0.4), 0 2px 8px rgba(0,0,0,0.25);
  transform: scale(1.15);
}

/* 클러스터 스타일 오버라이드 */
.marker-cluster-small,
.marker-cluster-medium,
.marker-cluster-large {
  border: 3px solid white !important;
  box-shadow: var(--shadow-md) !important;
}
.marker-cluster-small { background-color: rgba(255,75,43,0.15) !important; }
.marker-cluster-small div { background-color: rgba(255,75,43,0.5) !important; }
.marker-cluster-medium { background-color: rgba(255,75,43,0.20) !important; }
.marker-cluster-medium div { background-color: rgba(255,75,43,0.65) !important; }
.marker-cluster-large { background-color: rgba(255,75,43,0.25) !important; }
.marker-cluster-large div { background-color: rgba(255,75,43,0.80) !important; }
.marker-cluster div { color: white !important; font-weight: 700 !important; }

/* ===== 스피너 ===== */
#loading-overlay {
  position: fixed;
  inset: 0;
  background: white;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  transition: opacity 0.4s ease;
}
#loading-overlay.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--color-border);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; font-weight: 600; color: var(--color-text-secondary); }

/* Leaflet z-index fix */
.leaflet-top, .leaflet-bottom { z-index: 700 !important; }

.popup-address { font-size: 11px; color: #6B6B80; margin: 4px 0; line-height: 1.35; }
.popup-cat { display: inline-block; font-size: 10px; padding: 2px 7px; background: #F1F1F5; color: #4A4A55; border-radius: 4px; margin-top: 2px; }
</style>
</head>
<body>

<!-- 로딩 오버레이 -->
<div id="loading-overlay">
  <div style="width:44px;height:44px;background:var(--color-primary);border-radius:12px;display:flex;align-items:center;justify-content:center">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z" fill="white"/>
    </svg>
  </div>
  <div class="spinner"></div>
  <div class="loading-text">맛집 396곳을 불러오는 중...</div>
</div>

<!-- 헤더 -->
<header id="header">
  <div id="header-logo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="white"/>
    </svg>
  </div>
  <div id="header-title">
    <h1>백년해방 맛집 지도</h1>
    <div class="subtitle">전국 396개 맛집</div>
  </div>
  <a id="header-channel-link" href="https://youtube.com/channel/UCSW_W-SE71e9OhZwPEkEDLA" target="_blank" rel="noopener">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
      <path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/>
    </svg>
    채널
  </a>
</header>

<!-- 지도 -->
<div id="map"></div>

<!-- 지도 컨트롤 버튼 -->
<div id="map-controls">
  <button class="map-btn" id="btn-location" title="내 위치">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      <circle cx="12" cy="12" r="7" stroke-dasharray="2 2"/>
    </svg>
  </button>
  <button class="map-btn" id="btn-reset" title="전체 보기">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
    </svg>
  </button>
</div>

<!-- 바텀 시트 -->
<div id="sheet" class="state-peek">
  <div id="sheet-handle-area">
    <div class="drag-handle"></div>
  </div>

function getColor(region) {
  return REGION_COLORS[region] || "#6B6B80";
}

// ===== 지도 초기화 =====
const map = L.map("map", {
  center: [36.5, 127.8],
  zoom: 7,
  zoomControl: false,
});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19,
}).addTo(map);
L.control.zoom({ position: "topright" }).addTo(map);

// ===== 마커 클러스터 그룹 =====
const clusterGroup = L.markerClusterGroup({
  showCoverageOnHover: false,
  maxClusterRadius: 50,
  spiderfyOnMaxZoom: true,
  chunkedLoading: true,
});

// ===== 마커 생성 =====
function createMarkerIcon(color, isHighlighted) {
  const cls = isHighlighted ? "custom-marker near-highlight" : "custom-marker";
  return L.divIcon({
    className: "",
    html: `<div class="${cls}" style="background:${color}"></div>`,
    iconSize: [22, 22],
    iconAnchor: [11, 11],
    popupAnchor: [0, -14],
  });
}

const markers = [];
RESTAURANTS.forEach((r, idx) => {
  const color = getColor(r.macro_region);
  const marker = L.marker([r.lat, r.lng], {
    icon: createMarkerIcon(color, false),
    title: r.name,
  });
  marker._restaurantIdx = idx;
  marker._color = color;
  marker.bindPopup(buildPopupHtml(r), { maxWidth: 240, className: "custom-popup" });
  marker.on("click", () => highlightCard(idx));
  markers.push(marker);
});

function buildPopupHtml(r) {
  const color = getColor(r.macro_region);
  return `<div class="popup-inner">
    <div class="popup-region-badge" style="background:${color}">${r.macro_region}</div>
    <div class="popup-name">${r.name}</div>
    <div class="popup-area">${r.area && r.area !== r.macro_region ? r.area + " · " : ""}${r.macro_region}</div>
    ${r.address ? `<div class="popup-address">📍 ${r.address}</div>` : ""}
    ${r.category ? `<div class="popup-cat">${r.category}</div>` : ""}
    <div class="popup-video-title">${r.video_count > 1 ? `${r.video_count}개 영상에 소개됨` : (r.videos[0]?.video_title || "")}</div>
    ${r.videos.map((v,i) => `<a class="popup-yt-link" href="${v.video_url}" target="_blank" rel="noopener" style="${i>0?'margin-top:4px':''}"><svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/></svg>${r.video_count > 1 ? `영상 ${i+1}` : '유튜브에서 보기'}</a>`).join("")}
  </div>`;
}

// ===== 필터 칩 생성 =====
const regions = ["전체", ...Object.keys(REGION_COLORS).filter(k => RESTAURANTS.some(r => r.macro_region === k))];
const activeRegions = new Set();

const filterChipsEl = document.getElementById("filter-chips");
regions.forEach(region => {
  const chip = document.createElement("button");
  chip.className = "filter-chip" + (region === "전체" ? " active" : "");
  const color = region === "전체" ? "#6B6B80" : getColor(region);
  const count = region === "전체" ? RESTAURANTS.length : RESTAURANTS.filter(r => r.macro_region === region).length;
  chip.innerHTML = `<span class="chip-dot" style="background:${color}"></span>${region} <span style="opacity:0.65;font-weight:500;margin-left:2px">${count}</span>`;
  chip.dataset.region = region;
  chip.addEventListener("click", () => toggleRegionFilter(region, chip));
  filterChipsEl.appendChild(chip);
});

function toggleRegionFilter(region, chipEl) {
  if (region === "전체") {
    activeRegions.clear();
    document.querySelectorAll(".filter-chip").forEach(c => {
      c.classList.toggle("active", c.dataset.region === "전체");
    });
  } else {
    // 전체 칩 해제
    document.querySelector(".filter-chip[data-region=\"전체\"]").classList.remove("active");
    if (activeRegions.has(region)) {
      activeRegions.delete(region);
      chipEl.classList.remove("active");
    } else {
      activeRegions.add(region);
      chipEl.classList.add("active");
    }
    if (activeRegions.size === 0) {
      document.querySelector(".filter-chip[data-region=\"전체\"]").classList.add("active");
    }
  }
  applyFilters();
}

// ===== 검색 =====
const searchInput = document.getElementById("search-input");
const searchClear = document.getElementById("search-clear");

searchInput.addEventListener("input", () => {
  const val = searchInput.value.trim();
  searchClear.classList.toggle("visible", val.length > 0);
  applyFilters();
  if (sheet.className !== "state-full" && sheet.className !== "state-mid") {
    setSheetState("state-mid");
  }
});
searchInput.addEventListener("focus", () => {
  if (window.innerWidth < 768 && sheet.className === "state-peek") {
    setSheetState("state-mid");
  }
});
searchClear.addEventListener("click", () => {
  searchInput.value = "";
  searchClear.classList.remove("visible");
  applyFilters();
  searchInput.focus();
});

// ===== 필터 적용 =====
let filteredIndices = RESTAURANTS.map((_, i) => i);

function applyFilters() {
  const query = searchInput.value.trim().toLowerCase();
  filteredIndices = RESTAURANTS.map((r, i) => {
    const regionOk = activeRegions.size === 0 || activeRegions.has(r.macro_region);
    const queryOk = !query || r.name.toLowerCase().includes(query) || r.area.toLowerCase().includes(query) || r.macro_region.toLowerCase().includes(query);
    return regionOk && queryOk ? i : -1;
  }).filter(i => i >= 0);

  renderList();
  updateMapMarkers();
}

function renderList() {
  const listEl = document.getElementById("restaurant-list");
  const countEl = document.getElementById("list-count");
  const emptyEl = document.getElementById("empty-state");

  countEl.textContent = `${filteredIndices.length}개 맛집`;
  listEl.innerHTML = "";

  if (filteredIndices.length === 0) {
    emptyEl.classList.add("visible");
    return;
  }
  emptyEl.classList.remove("visible");

  const fragment = document.createDocumentFragment();
  filteredIndices.forEach(idx => {
    const r = RESTAURANTS[idx];
    const color = getColor(r.macro_region);
    const card = document.createElement("div");
    card.className = "restaurant-card";
    card.dataset.idx = idx;
    card.innerHTML = `
      <div class="card-dot" style="background:${color};color:${color}"></div>
      <div class="card-content">
        <div class="card-name">${r.name}</div>
        <span class="card-area-chip" style="background:${color}">${r.macro_region}</span>
        <div class="card-video">
          <svg class="card-video-icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/></svg>
          ${r.video_count > 1 ? `${r.video_count}개 영상에 소개` : (r.videos[0]?.video_title || "")}
        </div>
      </div>`;
    card.addEventListener("click", () => flyToRestaurant(idx));
    fragment.appendChild(card);
  });
  listEl.appendChild(fragment);
}

function updateMapMarkers() {
  clusterGroup.clearLayers();
  const filteredSet = new Set(filteredIndices);
  filteredIndices.forEach(idx => {
    clusterGroup.addLayer(markers[idx]);
  });
}

function flyToRestaurant(idx) {
  const r = RESTAURANTS[idx];
  map.flyTo([r.lat, r.lng], 17, { duration: 0.8 });
  setTimeout(() => markers[idx].openPopup(), 900);
  highlightCard(idx);

  if (window.innerWidth < 768) {
    setSheetState("state-peek");
  }
}

function highlightCard(idx) {
  document.querySelectorAll(".restaurant-card").forEach(c => {
    c.classList.toggle("highlighted", parseInt(c.dataset.idx) === idx);
  });
  const card = document.querySelector(`.restaurant-card[data-idx="${idx}"]`);
  if (card) {
    card.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

// ===== 바텀 시트 드래그 =====
const sheet = document.getElementById("sheet");
const handleArea = document.getElementById("sheet-handle-area");
let startY = 0, startTranslate = 0, isDragging = false;
const SHEET_HEIGHTS = {
  "state-peek": window.innerHeight - 72,
  "state-mid": window.innerHeight * 0.58,
  "state-full": window.innerHeight * 0.13,
};

function setSheetState(state) {
  sheet.className = state;
  // 컨트롤 버튼 위치도 조정
  const controls = document.getElementById("map-controls");
  if (state === "state-peek") {
    controls.style.bottom = "calc(var(--sheet-peek) + 16px)";
  } else if (state === "state-mid") {
    controls.style.bottom = "calc(var(--sheet-mid) + 16px)";
  } else {
    controls.style.bottom = "calc(var(--sheet-full) + 16px)";
  }
}

function getSheetTranslate() {
  const style = window.getComputedStyle(sheet);
  const matrix = new DOMMatrix(style.transform);
  return matrix.m42;
}

handleArea.addEventListener("pointerdown", e => {
  if (window.innerWidth >= 768) return;
  isDragging = true;
  startY = e.clientY;
  startTranslate = getSheetTranslate();
  sheet.style.transition = "none";
  handleArea.setPointerCapture(e.pointerId);
});

handleArea.addEventListener("pointermove", e => {
  if (!isDragging) return;
  const delta = e.clientY - startY;
  const newTranslate = Math.max(window.innerHeight * 0.08, Math.min(window.innerHeight - 55, startTranslate + delta));
  sheet.style.transform = `translateY(${newTranslate}px)`;
});

handleArea.addEventListener("pointerup", e => {
  if (!isDragging) return;
  isDragging = false;
  sheet.style.transition = "";
  sheet.style.transform = "";

  const currentY = getSheetTranslate();
  const h = window.innerHeight;

  if (currentY < h * 0.25) {
    setSheetState("state-full");
  } else if (currentY < h * 0.65) {
    setSheetState("state-mid");
  } else {
    setSheetState("state-peek");
  }
});

// 핸들 탭으로 상태 전환
handleArea.addEventListener("click", e => {
  if (window.innerWidth >= 768) return;
  if (isDragging) return;
  const states = ["state-peek", "state-mid", "state-full"];
  const cur = states.indexOf(sheet.className);
  setSheetState(states[(cur + 1) % states.length]);
});

// ===== 현재 위치 버튼 =====
const btnLocation = document.getElementById("btn-location");
let nearHighlightActive = false;

btnLocation.addEventListener("click", () => {
  if (!navigator.geolocation) {
    showToast("위치 정보를 지원하지 않는 브라우저입니다");
    return;
  }
  showToast("현재 위치를 찾는 중...");
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude, longitude } = pos.coords;
    map.flyTo([latitude, longitude], 14, { duration: 1 });
    btnLocation.classList.add("active");
    nearHighlightActive = true;

    // 가장 가까운 10개
    const dists = RESTAURANTS.map((r, i) => ({
      idx: i,
      dist: Math.hypot(r.lat - latitude, r.lng - longitude),
    })).sort((a, b) => a.dist - b.dist);
    const nearSet = new Set(dists.slice(0, 10).map(d => d.idx));

    markers.forEach((m, i) => {
      const color = m._color;
      m.setIcon(createMarkerIcon(color, nearSet.has(i)));
    });

    showToast(`내 주변 가장 가까운 10개 맛집을 강조했습니다`);
    setTimeout(() => {
      btnLocation.classList.remove("active");
      markers.forEach((m, i) => m.setIcon(createMarkerIcon(m._color, false)));
      nearHighlightActive = false;
    }, 8000);
  }, () => {
    showToast("위치 정보 접근이 거부되었습니다");
  }, { timeout: 8000 });
});

// ===== 전체 보기 버튼 =====
document.getElementById("btn-reset").addEventListener("click", () => {
  map.flyTo([36.5, 127.8], 7, { duration: 1 });
});

// ===== 토스트 =====
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
}

// ===== 초기화 =====
function init() {
  clusterGroup.addTo(map);
  applyFilters(); // 전체 렌더링
  document.getElementById("loading-overlay").classList.add("hidden");
}

// Leaflet 로드 완료 후 초기화
if (typeof L !== "undefined") {
  init();
} else {
  window.addEventListener("load", init);
}
</script>
